<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clavier Français — Learn French Through Typing Practice</title>
    <meta
      name="description"
      content="Master French vocabulary, grammar, and sentences through interactive typing practice with lifelike native French voices and a bright Typing.com-inspired interface."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231C88F5'/%3E%3Crect x='8' y='10' width='48' height='40' rx='9' fill='%23FFFFFF'/%3E%3Ctext x='32' y='37' text-anchor='middle' font-family='sans-serif' font-weight='800' font-size='22' fill='%231C88F5'%3EFr%3C/text%3E%3Crect x='14' y='52' width='12' height='4' rx='2' fill='%232563EB'/%3E%3Crect x='26' y='52' width='12' height='4' rx='2' fill='%23FFFFFF'/%3E%3Crect x='38' y='52' width='12' height='4' rx='2' fill='%23EF4444'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="app">
      <header class="topbar" role="banner">
        <div class="topbar-inner">
          <button type="button" class="brand" id="brand-home-btn" aria-label="Clavier Français Home">
            <span class="brand-keycap" aria-hidden="true">
              <span class="brand-keycap-letter">Fr</span>
              <span class="brand-tricolor"><i></i><i></i><i></i></span>
            </span>
            <span class="brand-text">
              <span class="brand-title">Clavier <span class="brand-accent">Français</span></span>
              <span class="brand-sub">Type to Learn French</span>
            </span>
          </button>

          <nav class="main-nav" aria-label="Primary Navigation">
            <button type="button" class="nav-tab is-active" id="nav-lessons" data-view="lessons">
              <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M3 5.5A2.5 2.5 0 0 1 5.5 3h9A2.5 2.5 0 0 1 17 5.5v9a2.5 2.5 0 0 1-2.5 2.5h-9A2.5 2.5 0 0 1 3 14.5v-9Z" stroke="currentColor" stroke-width="1.7"/><path d="M7 7.5h6M7 10.5h6M7 13.5h3.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
              <span>Lessons</span>
            </button>
            <button type="button" class="nav-tab" id="nav-stage" data-view="stage">
              <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><rect x="2.5" y="4.5" width="15" height="11" rx="2.2" stroke="currentColor" stroke-width="1.7"/><path d="M5.5 8.5h1.5M9.25 8.5h1.5M13 8.5h1.5M6.5 12h7" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
              <span>Typing Stage</span>
            </button>
            <button type="button" class="nav-tab" id="nav-phrasebook" data-view="phrasebook">
              <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M4 4.5A1.5 1.5 0 0 1 5.5 3H15a1 1 0 0 1 1 1v12.5a.5.5 0 0 1-.8.4l-2.7-2-2.7 2a.5.5 0 0 1-.6 0l-2.7-2-2.7 2A.5.5 0 0 1 4 16.5v-12Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
              <span>Phrasebook &amp; Grammar</span>
            </button>
          </nav>

          <div class="header-stats" aria-label="Your Progress Summary">
            <div class="stat-chip stat-streak" title="Current study streak">
              <span class="stat-icon" aria-hidden="true">🔥</span>
              <span class="stat-value" id="hdr-streak">0</span>
              <span class="stat-label">day</span>
            </div>
            <div class="stat-chip stat-stars" title="Total stars earned">
              <span class="stat-icon" aria-hidden="true">★</span>
              <span class="stat-value" id="hdr-stars">0</span>
            </div>
            <div class="stat-chip stat-wpm" title="Personal best speed">
              <span class="stat-value" id="hdr-best-wpm">0</span>
              <span class="stat-label">WPM</span>
            </div>
          </div>
        </div>
      </header>

      <main class="main-shell" id="main-content" role="main">
        <!-- Rendered dynamically by view modules -->
      </main>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
